# LlamaFactory LoRA SFT 配置
# 用法: llamafactory-cli train train_lora.yaml
# base: DeepSeek-R1-Distill-Qwen-7B, LoRA 只训低秩适配矩阵, 单卡 24G 可跑

### model
model_name_or_path: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
# dataset_dir 指向本目录（dataset_info.json 所在处）
dataset: insurance_sft
dataset_dir: .
template: deepseekr1
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: output/deepseek-r1-7b-ins-lora
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
